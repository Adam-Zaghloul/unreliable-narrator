<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">System architecture</title>
  <desc id="d">Badges and room beacons talk over Bluetooth; badges send packets to a gateway over ESP-NOW; the gateway feeds the hub over USB. In the hub, the truth engine decides what is true, the liar proposes claims, and the validator checks every claim before the speaker, big screen and reveal page use it.</desc>
  <style>
    .bg{fill:#ffffff}.box{fill:#faf9f6;stroke:#d9d4c7;stroke-width:1.5}.hub{fill:#f5f3ee;stroke:#d9d4c7;stroke-width:1.5}
    .key{fill:#fff4f2;stroke:#c23a2e;stroke-width:1.5}.ok{fill:#eef6f1;stroke:#1f7047;stroke-width:1.5}
    text{font:15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1a17}
    .s{font-size:12.5px;fill:#6b675e}.h{font-weight:650}.cap{font-size:11px;letter-spacing:.12em;fill:#6b675e;font-weight:650}
    .ln{stroke:#6b675e;stroke-width:1.5;fill:none}.arr{fill:#6b675e}
    @media (prefers-color-scheme:dark){
      .bg{fill:#161513}.box{fill:#1f1e1b;stroke:#3a3732}.hub{fill:#1b1a18;stroke:#3a3732}
      .key{fill:#2c1a17;stroke:#f07163}.ok{fill:#16271c;stroke:#62c08a}
      text{fill:#efece6}.s,.cap{fill:#a39e93}.ln{stroke:#a39e93}.arr{fill:#a39e93}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" class="arr"/></marker></defs>
  <rect class="bg" width="960" height="430" rx="14"/>

  <text class="cap" x="32" y="40">IN THE ROOM</text>
  <rect class="box" x="32" y="56" width="190" height="78" rx="10"/>
  <text class="h" x="50" y="86">Room beacons</text><text class="s" x="50" y="108">1 per room · BLE advert</text>
  <rect class="box" x="32" y="160" width="190" height="96" rx="10"/>
  <text class="h" x="50" y="190">Player badges</text><text class="s" x="50" y="212">scan beacons · TRUE / LIE</text>
  <text class="s" x="50" y="231">buttons · buzz motor</text>
  <rect class="box" x="32" y="290" width="190" height="78" rx="10"/>
  <text class="h" x="50" y="320">Gateway</text><text class="s" x="50" y="342">ESP-NOW → USB serial</text>
  <path class="ln" d="M127 134v26" marker-end="url(#a)"/>
  <path class="ln" d="M127 256v34" marker-end="url(#a)"/>
  <text class="s" x="136" y="151">RSSI</text><text class="s" x="136" y="278">every 2 s</text>

  <text class="cap" x="262" y="40">HUB · LAPTOP</text>
  <rect class="hub" x="262" y="56" width="440" height="342" rx="12"/>
  <path class="ln" d="M222 329h58" marker-end="url(#a)"/>
  <rect class="ok" x="282" y="290" width="190" height="78" rx="10"/>
  <text class="h" x="298" y="320">Truth engine</text><text class="s" x="298" y="342">median · hysteresis · ≥ 20 s</text>
  <rect class="box" x="282" y="80" width="190" height="96" rx="10"/>
  <text class="h" x="298" y="110">Liar</text><text class="s" x="298" y="132">random · rule-based ·</text>
  <text class="s" x="298" y="151">Claude (structured JSON)</text>
  <rect class="key" x="492" y="180" width="190" height="104" rx="10"/>
  <text class="h" x="508" y="210">Validator</text><text class="s" x="508" y="232">re-checks every label</text>
  <text class="s" x="508" y="251">renders the sentence</text><text class="s" x="508" y="270">rejects banned claims</text>
  <path class="ln" d="M472 128c40 0 60 20 80 52" marker-end="url(#a)"/>
  <path class="ln" d="M472 329c40 0 60-15 80-45" marker-end="url(#a)"/>
  <text class="s" x="488" y="122">proposes claims</text><text class="s" x="476" y="354">decides truth</text>

  <text class="cap" x="742" y="40">OUT</text>
  <rect class="box" x="742" y="80" width="186" height="64" rx="10"/>
  <text class="h" x="760" y="108">Speaker</text><text class="s" x="760" y="128">reads each statement</text>
  <rect class="box" x="742" y="170" width="186" height="64" rx="10"/>
  <text class="h" x="760" y="198">Big screen</text><text class="s" x="760" y="218">timer · votes in</text>
  <rect class="box" x="742" y="260" width="186" height="64" rx="10"/>
  <text class="h" x="760" y="288">Reveal page</text><text class="s" x="760" y="308">every lie, who fell for it</text>
  <path class="ln" d="M682 222c30 0 30-110 58-110" marker-end="url(#a)"/>
  <path class="ln" d="M682 230h58" marker-end="url(#a)"/>
  <path class="ln" d="M682 240c30 0 30 52 58 52" marker-end="url(#a)"/>
  <rect class="box" x="742" y="350" width="186" height="48" rx="10"/>
  <text class="h" x="760" y="379">SQLite · 1 file/game</text>

  <text class="s" x="282" y="416">The AI never decides what is true. Code does; the AI only chooses which lies to tell.</text>
</svg>
