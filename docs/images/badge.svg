<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Player badge, design drawing</title>
  <desc id="d">Front of the planned badge: a rounded enclosure on a lanyard with a green TRUE button on the left and a red LIE button on the right. Inside: an ESP32-C3 SuperMini, a 450 mAh LiPo with a USB-C charger, and a coin vibration motor driven by a 2N7000. This is a design drawing; the hardware is not built yet.</desc>
  <style>
    .bg{fill:#ffffff}.body{fill:#faf9f6;stroke:#1b1a17;stroke-width:2}.pcb{fill:#e9f0ea;stroke:#5b7a63;stroke-width:1.5}
    .part{fill:#ffffff;stroke:#6b675e;stroke-width:1.5}.lan{stroke:#6b675e;stroke-width:6;fill:none;stroke-linecap:round}
    .t{fill:#1f7047}.l{fill:#c23a2e}.ink{fill:#1b1a17}
    text{font:15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1a17}
    .s{font-size:12.5px;fill:#6b675e}.h{font-weight:650}.btn{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#ffffff}
    .ln{stroke:#6b675e;stroke-width:1.2;fill:none;stroke-dasharray:3 3}.cap{font-size:11px;letter-spacing:.12em;fill:#6b675e;font-weight:650}
    @media (prefers-color-scheme:dark){
      .bg{fill:#161513}.body{fill:#1f1e1b;stroke:#efece6}.pcb{fill:#1a2a1f;stroke:#7fa287}.part{fill:#161513;stroke:#a39e93}
      .lan{stroke:#a39e93}.t{fill:#62c08a}.l{fill:#f07163}.ink{fill:#efece6}text{fill:#efece6}.s,.cap{fill:#a39e93}
      .btn{fill:#111}.ln{stroke:#a39e93}}
  </style>
  <rect class="bg" width="960" height="420" rx="14"/>
  <text class="cap" x="40" y="40">FRONT</text>
  <path class="lan" d="M120 20c20 50 45 80 70 93M260 20c-20 50-45 80-70 93"/>
  <rect class="body" x="80" y="96" width="220" height="280" rx="34"/>
  <circle class="part" cx="190" cy="122" r="9"/>
  <text class="ink" x="190" y="196" text-anchor="middle" style="font:600 22px 'Iowan Old Style',Palatino,Georgia,serif">P3</text>
  <text class="s" x="190" y="218" text-anchor="middle">badge id</text>
  <circle class="t" cx="140" cy="300" r="34"/><text class="btn" x="140" y="305" text-anchor="middle">TRUE</text>
  <circle class="l" cx="240" cy="300" r="34"/><text class="btn" x="240" y="305" text-anchor="middle">LIE</text>

  <text class="cap" x="400" y="40">INSIDE</text>
  <rect class="body" x="400" y="96" width="220" height="280" rx="34" style="stroke-dasharray:6 5"/>
  <rect class="pcb" x="450" y="120" width="120" height="86" rx="6"/>
  <rect class="part" x="490" y="140" width="40" height="40" rx="3"/>
  <rect class="part" x="440" y="222" width="140" height="66" rx="8"/>
  <circle class="part" cx="510" cy="330" r="22"/><circle class="part" cx="510" cy="330" r="8"/>
  <rect class="part" x="560" y="318" width="22" height="24" rx="3"/>

  <path class="ln" d="M570 163H690"/><text class="h" x="700" y="158">ESP32-C3 SuperMini</text>
  <text class="s" x="700" y="178">BLE scan + ESP-NOW · about CA$4</text>
  <path class="ln" d="M580 255H690"/><text class="h" x="700" y="250">450 mAh LiPo + TP4056</text>
  <text class="s" x="700" y="270">USB-C · battery life still to measure</text>
  <path class="ln" d="M582 330H690"/><text class="h" x="700" y="325">Coin motor + 2N7000</text>
  <text class="s" x="700" y="345">the witness-ping buzz</text>
  <text class="s" x="40" y="404">Design drawing. The badge has not been built yet; part choices are in the README bill of materials.</text>
</svg>
