[project]
name = "unreliable-narrator"
version = "0.1.0"
description = "In-person party game where the AI narrator is the traitor and ESP32 badges hold the truth."
requires-python = ">=3.12"
dependencies = ["anthropic>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
